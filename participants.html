<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Участники Pristal</title><link rel="stylesheet" href="css/style.css"></head><body><h1>🤝 Участники развития Pristal</h1><div id="list"></div><script>fetch('participants.json').then(x=>x.json()).then(d=>list.innerHTML=d.map(p=>`<div class="card"><img src="https://minotar.net/avatar/${p.nick}/64"><b>${p.nick}</b><small>${p.help}</small></div>`).join(''))</script></body></html>
