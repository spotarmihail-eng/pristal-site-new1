<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a855f7"><title>Участники Pristal</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#24103e 0%,#0a0712 54%,#070a0f 100%);color:#f8f5ff;font-family:Inter,system-ui,Arial,sans-serif;text-align:center;padding:48px 18px 70px}header{max-width:1080px;margin:0 auto 35px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em;margin:0 0 12px}h1 span{color:#c084fc;text-shadow:0 0 28px #a855f755}header p{color:#c4b5d6;margin:0 0 20px}.back{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid #a855f766;border-radius:12px;color:#f3e8ff;background:#a855f71c;text-decoration:none;font-weight:700;transition:.2s}.back:hover{transform:translateY(-2px);background:#a855f733}.list{max-width:1080px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;text-align:left}.card{display:flex;gap:15px;align-items:center;background:linear-gradient(140deg,#1a1028ed,#100c19ed);border:1px solid #c084fc35;margin:0;padding:16px;border-radius:18px;min-width:0;box-shadow:0 12px 32px #0003;transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);border-color:#c084fc9c;box-shadow:0 15px 38px #8b5cf633}img{width:64px;height:64px;border-radius:15px;image-rendering:pixelated;background:#21132e;border:1px solid #c084fc40}.name{font-weight:850;font-size:16px;overflow-wrap:anywhere}.small{color:#b7a8ca;font-size:13px;margin-top:4px;line-height:1.45}.empty{grid-column:1/-1;text-align:center;padding:30px;color:#b7a8ca}@media(max-width:520px){body{padding:32px 14px}.card{padding:13px}}
</style></head><body><header><h1>🤝 Участники <span>Pristal</span></h1><p>Спасибо каждому, кто помогает развивать наше сообщество.</p><a class="back" href="./">← На главную</a></header><main id="list" class="list"><div class="empty">Загружаем список участников…</div></main><script>
const list=document.getElementById('list');fetch('participants.json').then(r=>{if(!r.ok)throw new Error('Не удалось загрузить список');return r.json()}).then(d=>{list.innerHTML=d.length?d.map(p=>`<article class="card"><img loading="lazy" src="https://minotar.net/avatar/${encodeURIComponent(p.nick)}/64" alt="Аватар ${String(p.nick).replace(/[&<>"']/g,'')}"><div><div class="name">${String(p.nick).replace(/[&<>"']/g,'')}</div><div class="small">${String(p.help||'Участник сообщества').replace(/[&<>"']/g,'')}</div></div></article>`).join(''):'<div class="empty">Список участников пока пуст.</div>'}).catch(()=>{list.innerHTML='<div class="empty">Не удалось загрузить участников. Попробуйте обновить страницу.</div>'});
</script></body></html>
