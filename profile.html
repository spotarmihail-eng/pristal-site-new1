<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — Pristal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#a855f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23160923'/%3E%3Cpath d='M32 10l6 16 16 6-16 6-6 16-6-16-16-6 16-6z' fill='%23a855f7'/%3E%3C/svg%3E">
<script src="config.js"></script>
<style>
:root{--accent:#a855f7;--muted:#9aa3b2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#070a0f;color:#f5f7fb;line-height:1.55;overflow-x:hidden}
img{display:block}button,input{font-family:inherit}[hidden]{display:none!important}
.bg{position:fixed;inset:0;z-index:-1;background:center/cover;opacity:.22}
.wrap{width:min(980px,92%);margin:auto}
header{position:sticky;top:0;z-index:50;background:rgba(7,10,15,.82);backdrop-filter:blur(16px);border-bottom:1px solid #ffffff14}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:24px;font-weight:900;letter-spacing:.08em;text-decoration:none;color:inherit}.logo span{color:var(--accent)}
nav{display:flex;align-items:center;gap:6px}
nav a{padding:9px 12px;border-radius:10px;color:#b9c0ca;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}
nav a:hover,nav a.on{color:#fff;background:#ffffff12}nav a.dc{background:#5865f2;color:#fff}
.me-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:12px;border:1px solid #ffffff1f;background:#0d1219;font-weight:800;font-size:14px;max-width:170px}
.me-chip img{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:none}.me-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:44px 0 70px}
.card{background:linear-gradient(145deg,#111720ee,#0b0f15ee);border:1px solid #ffffff14;border-radius:22px;padding:28px}
.center{text-align:center}.center h1{font-size:28px;margin-bottom:8px}.center p{color:var(--muted);margin-bottom:18px}
.prof{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start}
.big-av{width:200px;height:200px;border-radius:28px;object-fit:cover;background:#0d1219;border:2px solid color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 20px 60px #0008}
.prof h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.rows{margin:18px 0;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:#0b0f15;border:1px solid #ffffff10}
.row span{color:var(--muted);font-size:14px}.row b{overflow-wrap:anywhere;text-align:right}
.pill{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800}
.pill.on{background:#16a34a33;color:#6ee7a0;border:1px solid #16a34a88}.pill.off{background:#ffffff10;color:#c0c7d2;border:1px solid #ffffff1f}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:12px 18px;border-radius:12px;border:1px solid #ffffff1f;background:#111721;color:#fff;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#160923}
.btn.danger{border-color:#ef444488;color:#fca5a5}.btn.danger:hover{background:#ef444422;border-color:#ef4444}
.modal{position:fixed;inset:0;z-index:100;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}.modal.open{display:flex}
.mbox{width:min(560px,100%);max-height:94vh;overflow:auto;background:#0d1219;border:1px solid #ffffff1f;border-radius:22px;padding:24px}
.mbox h2{margin-bottom:6px;letter-spacing:-.02em}.sub{color:var(--muted);margin-bottom:10px;display:block}
.mbox input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid #ffffff1f;background:#070a0f;color:#fff;font-size:16px;margin:6px 0}.mbox input:focus{outline:2px solid var(--accent)}
.err{color:#fca5a5;min-height:22px;font-size:14px;margin-bottom:8px}
.code{font-family:ui-monospace,monospace;font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:.08em;color:var(--accent);text-align:center;padding:16px;border-radius:14px;background:#070a0f;border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);margin:10px 0;user-select:all}
.cmd{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:#070a0f;font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.steps{margin:12px 0 10px 20px;color:#c8ced7}.steps li{margin:4px 0}.cd{font-variant-numeric:tabular-nums;color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px;margin:10px 0 14px}
.gal button{aspect-ratio:1;border-radius:16px;overflow:hidden;border:3px solid transparent;padding:0;cursor:pointer;background:#000;transition:.2s}
.gal button:hover{transform:translateY(-2px)}.gal button.on{border-color:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.gal img{width:100%;height:100%;object-fit:cover}
.preview{display:flex;align-items:center;gap:16px;padding:14px;border-radius:16px;background:#0b0f15;margin:12px 0}.preview img{width:84px;height:84px;border-radius:20px;object-fit:cover}.preview b{font-size:20px;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);z-index:120;padding:12px 18px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:999px;background:rgba(15,18,26,.95);color:#fff;opacity:0;pointer-events:none;transition:.25s;font-weight:700;max-width:calc(100vw - 28px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.prof{grid-template-columns:1fr;justify-items:center}.prof>div{width:100%;text-align:center}.big-av{width:150px;height:150px}.btns{justify-content:center}.row b{text-align:right}nav a.hs{display:none}nav a{padding:8px 9px;font-size:13px}.logo{font-size:20px}.me-chip{padding:4px}.me-chip span{display:none}}
.prof2{transition:transform .15s ease-out;will-change:transform}
.cover{height:170px;border-radius:24px 24px 0 0;position:relative;overflow:hidden;background:var(--cv,linear-gradient(135deg,#0b0f15,color-mix(in srgb,var(--accent) 65%,#0b0f15)))}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0d1219)}
.edit-cv{position:absolute;right:14px;top:14px;z-index:2;padding:8px 14px;background:#0009;backdrop-filter:blur(6px)}
.hero{position:relative;padding:0 28px 26px;border-radius:0 0 24px 24px;background:linear-gradient(145deg,#111720,#0b0f15);border:1px solid #ffffff14;border-top:0}
.hero-in{display:flex;gap:24px;align-items:flex-end;margin-top:-66px;flex-wrap:wrap;position:relative;z-index:2}
.av-wrap{position:relative;width:148px;height:148px;flex:none}
.ring{position:absolute;inset:-6px;border-radius:36px;background:linear-gradient(135deg,var(--accent),#ffffff66,var(--accent),#ffffff66,var(--accent));background-size:300% 300%;box-shadow:0 0 26px color-mix(in srgb,var(--accent) 45%,transparent);animation:shimmer 4s ease-in-out infinite alternate}
@keyframes shimmer{from{background-position:0 0}to{background-position:100% 100%}}
.av-wrap .big-av{position:relative;width:148px;height:148px;border-radius:30px;border:4px solid #0d1219;box-shadow:none}
.who{flex:1;min-width:220px}.who h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.handle{color:var(--muted);margin:2px 0 10px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.tabs{display:flex;gap:6px;margin:18px 0 14px;overflow-x:auto;padding-bottom:4px}
.tab{border:1px solid #ffffff17;background:#10161f;color:#aeb7c3;padding:11px 18px;border-radius:12px;cursor:pointer;font-weight:800;font-size:14px;white-space:nowrap;transition:.2s}
.tab:hover{color:#fff}.tab.on{background:var(--accent);border-color:var(--accent);color:#160923}
.panel{animation:rise .35s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:260px 1fr;gap:16px}
.ringcard{display:grid;place-items:center;text-align:center;gap:12px}
.pct{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#ffffff14 0);display:grid;place-items:center;position:relative}
.pct:before{content:"";position:absolute;inset:12px;border-radius:50%;background:#0d1219}.pct b{position:relative;font-size:34px}
.steps2{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#0b0f15;border:1px solid #ffffff10;cursor:pointer;text-align:left;color:#fff;font-size:15px;font-weight:700;width:100%;transition:.2s}
.step:hover{border-color:var(--accent);transform:translateX(3px)}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ffffff14;flex:none;font-size:14px}
.step.done{opacity:.8;cursor:default}.step.done i{background:var(--accent);color:#160923}.step.done:hover{transform:none;border-color:#ffffff10}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.tile{padding:16px;border-radius:16px;background:#0d1219;border:1px solid #ffffff10;text-align:center}.tile b{display:block;font-size:28px;color:var(--accent)}.tile span{color:var(--muted);font-size:13px}
.mc{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
.skin{display:grid;place-items:center;min-height:230px;border-radius:20px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--accent) 25%,transparent),#0b0f15 70%)}
.skin img{max-height:200px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 12px 18px #000a);transition:.3s}.skin:hover img{transform:scale(1.06) rotate(-2deg)}
.ph{font-size:80px;font-weight:900;color:var(--accent)}
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{padding:18px 12px;border-radius:18px;text-align:center;background:#0d1219;border:1px solid #ffffff10;color:#fff;cursor:pointer;transition:.25s}
.badge i{font-style:normal;font-size:38px;display:block;margin-bottom:6px}.badge b{display:block}.badge small{color:var(--muted);font-size:12px}
.badge.off{filter:grayscale(1);opacity:.5}
.badge.on{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 10%,#0d1219)}
.badge.on:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 25%,transparent)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0 16px}
.cv{height:70px;border-radius:14px;border:3px solid transparent;cursor:pointer;padding:0;transition:.2s}.cv:hover{transform:translateY(-2px)}.cv.on{border-color:#fff}
.conf{position:fixed;pointer-events:none;z-index:200}
.conf i{position:absolute;width:9px;height:9px;border-radius:2px;animation:pop 1.1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media(max-width:700px){.hero{padding:0 18px 22px}.hero-in{justify-content:center;text-align:center}.tags{justify-content:center}.grid2,.mc{grid-template-columns:1fr}.cover{height:130px}.tile b{font-size:22px}.mc .btns{justify-content:center}}
.badge{position:relative}
.badge em{position:absolute;top:9px;left:11px;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--rc,#94a3b8)}
.badge{padding-top:26px}
.badge.on{border-color:color-mix(in srgb,var(--rc,var(--accent)) 60%,transparent);background:color-mix(in srgb,var(--rc,var(--accent)) 9%,#0d1219)}
.badge.on:hover{box-shadow:0 12px 30px color-mix(in srgb,var(--rc,var(--accent)) 28%,transparent)}
.bar{height:6px;border-radius:6px;background:#ffffff14;overflow:hidden;margin:10px 0 0}
.bar span{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .6s}
.badge .bar{margin:8px 6px 4px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid #ffffff17;background:#10161f;color:#aeb7c3;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:800;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#160923}
.big-av{cursor:pointer}@keyframes flip{to{transform:rotate(360deg) scale(1.08)}}.big-av.spin{animation:flip .6s ease}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:360px){.logo{font-size:17px;letter-spacing:.04em}nav{gap:2px}nav a{padding:8px 7px;font-size:12px}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<header><div class="wrap nav">
  <a class="logo" href="./">PRI<span>STAL</span></a>
  <nav><a class="hs" href="./">Главная</a><a href="about.html">О нас</a><a class="on" href="profile.html">Профиль</a><a class="hs" href="participants.html">Участники</a><span id="authBox"></span></nav>
</div></header>
<main class="wrap"><div id="view"></div></main>
<div class="modal" id="m" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const CFG=window.PRISTAL||{},API=(CFG.API||'').replace(/\/+$/,''),MC=CFG.MC_SERVER||'';
const LOCAL=!API; // без сервера профиль хранится в браузере
const A={mint:'#72f27d',violet:'#a855f7',rose:'#ff8fb1',blue:'#78a9ff',sunset:'#ffb86b',mono:'#e8edf2',darkpink:'#ff6ccf',ice:'#7fffd4',forest:'#76d66f'};
let th='violet',bgn='all';try{th=localStorage.getItem('pristalTheme')||th;bgn=localStorage.getItem('pristalBg')||bgn}catch(e){}
document.documentElement.style.setProperty('--accent',A[th]||A.violet);
$('#bg').style.backgroundImage='url(assets/backgrounds/bg'+(/^[1-8]$/.test(bgn)?bgn:'2')+'.jpg)';

// tiny DOM helper: children are always text/nodes, never HTML
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)};
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('Скопировано: '+t)}catch(e){toast(t)}};
const S=()=>{try{return localStorage.getItem('pristalSession')}catch(e){return null}};
const AVS=Array.from({length:16},(_,i)=>'a'+(i+1));
const S1=new Set(["Admin", "Agent13", "Airu", "Anu49", "Ayano01", "Bado68", "Basuyo", "Biebu", "Buta", "CARLIK", "daku28", "DemonRPG", "dode", "eshize", "garakin", "GARUR4", "ннннн", "hogubi37", "Jia", "Kizepo", "Kusohe23", "makate", "matwei201303", "Mitezo", "Moguu", "moreto", "MrSkrenh", "noari", "nojo21", "okoyu", "oni", "phronya", "Pihete37", "Pijono", "pisu44", "pogi88", "Popao", "PriyaMehra", "Rapaya", "Reba", "Rega27", "roshi", "sajini", "schedase", "schuba79", "Schuhi64", "SHIKIMORO_YT", "shiramo", "Sidorovich2011", "Soba", "Suhischu", "tebo", "tobega93", "Topuki", "waku", "Warhark100", "Yotomi", "SecB_"].map(n=>n.toLowerCase()));
const S2=new Set(["Afflowyer", "AFK_Bot", "AFK_Bot123", "Agent13", "Azara_A", "BINOCLAYMOM", "DemonRPG", "Erik39", "fedrru", "fhwraztj", "fodrif", "Fomanax", "frenku152", "gg_loxzxc", "goEq", "goffyahh", "Grehen", "iisus424", "kajf707", "korol", "Kwar1ks", "List2424", "List2424mono", "Misha", "MOPSJOP5", "MrByLka52", "MrSkrenh", "mtn_dew", "Neo_Death833", "petya611", "POM1D0R41K", "porebr1k", "Preferred", "Pristalhard", "refi", "sasasiti", "shadowyline", "Skrenh", "skyhnwolker", "stepa342po", "TaHkucT_WoT", "tikikkikk", "Timkaaaa96", "Watermegatema3", "wemmbu", "Zipovec", "ZXC4707", "ZXC_ASDEWFD", "infectionss", "Kashimire", "ForestGuarber", "Franku152", "plonete4", "fen3but", "YRIK228", "PixelMest", "yura_shpurafgjhj", "Umni_", "ghttgggy", "Greensilver7799", "huylo", "Gilkipro", "motalka", "PixPley", "Batai_Olega", "FireMaks2280", "observer", "derect_123231", "plyw_bonnie", "yura_shpurafgjh"].map(n=>n.toLowerCase()));
let P=null,onClose=null;
const avSrc=p=>/^a\d{1,2}$/.test(p.avatar||'')?'assets/avatars/'+p.avatar+'.webp'
  :/^[a-z0-9_]+$/i.test(p.discordAvatar||'')?'https://cdn.discordapp.com/avatars/'+p.id+'/'+p.discordAvatar+'.png?size=256'
  :'https://cdn.discordapp.com/embed/avatars/'+Number((BigInt(p.id)>>22n)%6n)+'.png';
const fb=e=>{e.target.onerror=null;e.target.src='assets/avatars/a9.webp'}; // запасная аватарка, если Discord CDN недоступен
const syncUser=p=>{try{localStorage.setItem('pristalUser',JSON.stringify({id:p.id,name:p.nickname,avatar:p.discordAvatar||'',av:p.avatar||''}))}catch(e){}};

// ---- локальный режим (без сервера): данные лежат в localStorage этого браузера ----
const localUser=()=>{try{const u=JSON.parse(localStorage.getItem('pristalUser'));return u&&/^\d{5,25}$/.test(u.id)?u:null}catch(e){return null}};
const lget=u=>{let l=null;try{l=JSON.parse(localStorage.getItem('pristalLocal'))}catch(e){}return(!l||l.id!==u.id)?{id:u.id,discord:u.name}:l};
const lset=l=>{try{localStorage.setItem('pristalLocal',JSON.stringify(l))}catch(e){}};
const lprof=(u,l)=>({id:u.id,discord:l.discord,discordAvatar:u.avatar||null,nickname:l.nickname||l.discord||'Игрок',avatar:l.av||null,minecraft:l.mc?{nick:l.mc,linkedAt:l.at||0}:null,pending:null,linkMode:'local'});
function localApi(path,method,b){
  const u=localUser();if(!u)throw Object.assign(new Error('Войдите через Discord.'),{status:401});
  const l=lget(u);
  if(path==='/api/me')return lprof(u,l);
  if(path==='/api/profile'){
    const nn=String(b.nickname||'').trim();
    if(!/^[\p{L}\p{N} _.\-]{2,24}$/u.test(nn))throw new Error('Никнейм: 2–24 символа — буквы, цифры, пробел, _ . -');
    if(b.avatar&&!AVS.includes(b.avatar))throw new Error('Такой аватарки нет.');
    l.nickname=nn;l.av=b.avatar||null;lset(l);return lprof(u,l);
  }
  if(path==='/api/link/direct'){
    if(!/^[A-Za-z0-9_]{3,16}$/.test(b.nick||''))throw new Error('Ник: 3–16 символов — латиница, цифры и _');
    if(l.mc)throw new Error('Сначала отвяжите текущий ник.');
    l.mc=b.nick;l.at=Math.floor(Date.now()/1000);lset(l);return lprof(u,l);
  }
  if(path==='/api/link'&&method==='DELETE'){delete l.mc;lset(l);return{ok:true}}
  return{ok:true};
}

async function api(path,method='GET',body){
  if(LOCAL){try{return localApi(path,method,body||{})}catch(e){if(e.status===401)logout(false);throw e}}
  const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(S()||'')},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&path!=='/api/auth/logout')logout(false);
  if(!r.ok)throw Object.assign(new Error(d.message||'Ошибка '+r.status),{status:r.status});
  return d;
}
async function logout(call){
  if(call&&API&&S()){try{await api('/api/auth/logout','POST')}catch(e){}}
  try{localStorage.removeItem('pristalSession');localStorage.removeItem('pristalUser')}catch(e){}
  P=null;render();
}

// modal
const M=$('#m');
function openM(node,cb){onClose=cb||null;$('#mbox').replaceChildren(node);M.classList.add('open')}
function closeM(){M.classList.remove('open');if(onClose){const f=onClose;onClose=null;f()}}

function burst(){
  if(reduced())return;
  const c=h('div',{class:'conf'});c.style.left=innerWidth/2+'px';c.style.top=innerHeight/3+'px';document.body.append(c);
  const cols=['#a855f7','#22d3ee','#fde047','#fb7185','#4ade80','#ffffff'];
  for(let i=0;i<36;i++){const a=Math.random()*6.283,d=80+Math.random()*180,e=h('i');e.style.cssText='background:'+cols[i%6]+';--dx:'+Math.cos(a)*d+'px;--dy:'+(Math.sin(a)*d+60)+'px;--r:'+(Math.random()*720-360)+'deg';c.append(e)}
  setTimeout(()=>c.remove(),1300);
}
function countUp(el,pct){

}

function announce(bd){

  const mark=()=>{[...gal.children].forEach(b=>b.classList.toggle('on',b.dataset.a===(av||'')));img.src=avSrc({...P,avatar:av})};
  [null,...AVS].forEach(a=>gal.append(h('button',{type:'button','data-a':a||'',title:a?'Аватарка':'Как в Discord','aria-label':a?'Аватарка '+a:'Как в Discord',onclick:()=>{av=a;mark()}},h('img',{src:a?'assets/avatars/'+a+'.webp':avSrc({...P,avatar:null}),alt:'',onerror:fb}))));
  mark();
  const save=async()=>{err.textContent='';const was=P.nickname;try{P=await api('/api/profile','PUT',{nickname:nick.trim(),avatar:av});if(P.nickname!==was){try{localStorage.setItem('pristalRenamed','1')}catch(e){}}syncUser(P);closeM();render();toast('Профиль сохранён');burst()}catch(e){err.textContent=e.message}};
  openM(h('div',{},h('h2',{},'Изменить профиль'),h('div',{class:'preview'},img,name),h('label',{class:'sub'},'Никнейм на сайте'),inp,h('span',{class:'sub',style:'margin-top:10px'},'Аватарка (первая — как в Discord)'),gal,h('button',{class:'btn',type:'button',style:'margin-bottom:12px',onclick:()=>{av=AVS[Math.floor(Math.random()*AVS.length)];mark()}},'🎲 Случайная аватарка'),err,
    h('div',{class:'btns'},h('button',{class:'btn primary',onclick:save},'Сохранить'),h('button',{class:'btn',onclick:closeM},'Отмена'))));
}

render();
if(LOCAL?localUser():(API&&S()))api('/api/me').then(p=>{P=p;syncUser(p);render()}).catch(e=>{if(e.status!==401)$('#view').replaceChildren(note('Сервер профилей недоступен','Попробуй обновить страницу чуть позже.'))});
})();
</script>
