name: Pristal anarchy applications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pristal-anarchy-applications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Poll Discord applications and reactions
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPLICATION_CHANNEL_ID: ${{ secrets.APPLICATION_CHANNEL_ID }}
          ADMIN_DISCORD_ID: ${{ secrets.ADMIN_DISCORD_ID }}
        run: python .github/scripts/anarchy_applications.py
      - name: Commit updated statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anarchy-test-state.json anarchy-test-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync anarchy test applications"
            git push
          else
            echo "No application status changes."
          fi
