<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Участники Pristal</title><style>body{background:#080b12;color:white;font-family:Arial;text-align:center}.card{display:inline-flex;gap:15px;align-items:center;background:#182433;margin:8px;padding:15px;border-radius:15px;width:300px;text-align:left}img{width:64px;height:64px}.small{color:#aaa}</style></head><body><h1>🤝 Участники развития Pristal</h1><p>Спасибо всем, кто помогал проекту.</p><div id="list"></div><script>fetch('participants.json').then(r=>r.json()).then(d=>list.innerHTML=d.map(p=>`<div class="card"><img src="https://minotar.net/avatar/${encodeURIComponent(p.nick)}/64"><div><b>${p.nick}</b><div class="small">${p.help}</div></div></div>`).join(''))</script></body></html>
